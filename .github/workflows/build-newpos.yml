name: Build newpos bridge APK

# Standalone repo: builds the newpos flavor of the bridge app
# (applicationId com.couchtommouth.bridge.newpos) and publishes it as a
# GitHub Release so the in-app auto-updater can find and download it.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to create GitHub Releases
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (matches the project's wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Generate signing keystore
        working-directory: app
        run: |
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias c2m-release \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass c2mbridge2024 -keypass c2mbridge2024 \
              -dname "CN=CouchToMouth, OU=POS, O=CouchToMouth, C=GB"
          fi

      - name: Build newpos release APK
        run: gradle assembleNewposRelease --no-daemon --stacktrace

      - name: Read version info
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/[^0-9]//g')
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          APK=$(find app/build/outputs/apk/newpos/release -name '*.apk' | head -1)
          cp "$APK" app/build/outputs/apk/c2m-bridge-newpos.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: v${{ steps.version.outputs.name }}
          body: |
            Bridge app v${{ steps.version.outputs.name }} (code ${{ steps.version.outputs.code }})
            Built from ${{ github.sha }}
          files: app/build/outputs/apk/c2m-bridge-newpos.apk
          make_latest: true

      - name: Upload APK artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: c2m-newpos-apk
          path: app/build/outputs/apk/c2m-bridge-newpos.apk
          retention-days: 30
